<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일산교회 청년회</title>
  <meta name="theme-color" content="#f3f3f3" id="themeColor">
  <script>
    // 화면 밝기: 기본은 밝게. 내 정보에서 어둡게 / 기기 설정 따르기로 바꿀 수 있어요.
    (function () {
      var t = 'light';
      try { t = JSON.parse(localStorage.getItem('ya:theme')) || 'light'; } catch (e) {}
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeColor').setAttribute('content', t === 'dark' ? '#0a1328' : '#f3f3f3');
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="일산교회 청년회">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="offline" id="offline" role="status" hidden>인터넷 연결이 끊겼어요. 연결되면 다시 불러올 수 있어요.</div>
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main id="app" class="main" aria-live="polite"></main>
    <aside class="panel" id="panel" aria-label="이번 주"></aside>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
