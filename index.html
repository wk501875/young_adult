<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>일산교회 청년회</title>
  <meta name="theme-color" content="#f3ede0" id="themeColor">
  <script>
    // 화면 밝기: 기본은 밝게. 내 정보에서 어둡게 / 기기 설정 따르기로 바꿀 수 있어요.
    (function () {
      var t = 'light';
      try { t = JSON.parse(localStorage.getItem('ya:theme')) || 'light'; } catch (e) {}
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeColor').setAttribute('content', t === 'dark' ? '#020b1c' : '#f3ede0');
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="일산교회 청년회">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232b5f8e'/%3E%3Crect x='29' y='14' width='6' height='36' rx='2' fill='%23fff'/%3E%3Crect x='20' y='24' width='24' height='6' rx='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="offline" id="offline" role="status" hidden>인터넷 연결이 끊겼어요. 연결되면 다시 불러올 수 있어요.</div>
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main id="app" class="main" aria-live="polite"></main>
    <aside class="panel" id="panel" aria-label="이번 주"></aside>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
